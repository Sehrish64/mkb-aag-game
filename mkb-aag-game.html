<script>
"use strict";
/* ============================================================
   MKB AAG GAME — retro 2D platformer (single file)
   Sections: CONFIG | AUDIO | INPUT | SPRITES | LEVELS |
             PARTICLES | GAME | RENDER | UI | BOOT
   To add a level: copy a level object in LEVELS, bump order.
   To swap sounds: replace AudioSys methods (jump/collect/etc).
   ============================================================ */

/* ================= CONFIG ================= */
const VW = 960, VH = 540, GRAV = 2300;
const HERO_W = 46, HERO_H = 70;          // hero hitbox
const RUN_ACCEL = 2800, RUN_MAX = 350, FRICTION = 2600;
const JUMP_V = 800, JUMP_HOLD_GRAV = 900; // held jump = low gravity
const COYOTE = 0.10, JBUF = 0.14;

/* ================= AUDIO =================
   All procedural WebAudio. Swap any method body to use a file. */
const AudioSys = {
  ctx:null, muted:false, musicTimer:null, master:null, musicGain:null,
  init(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.30; this.musicGain.connect(this.master);
  },
  toggleMute(){ this.muted=!this.muted; if(this.master) this.master.gain.value=this.muted?0:0.9; return this.muted; },
  tone(freq, dur, type='square', vol=0.5, when=0, slideTo=null, dest=null){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime+when, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(dest||this.master); o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur, vol=0.4, when=0, hp=800){
    if(!this.ctx||this.muted) return;
    const t=this.ctx.currentTime+when, n=this.ctx.sampleRate*dur, buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ctx.createBufferSource(); s.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    const g=this.ctx.createGain(); g.gain.value=vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  /* --- SFX (swap bodies to use aag.mp3 / hania.mp3) --- */
  jump(){ // "aag" whoosh — replace with aag.mp3 for the real voice
    this.noise(0.28,0.5,0,400); this.tone(300,0.25,'sawtooth',0.25,0,900);
  },
  collect(){ // sparkle chime
    [880,1174,1568].forEach((f,i)=>this.tone(f,0.18,'sine',0.35,i*0.07));
  },
  sayHania(){ // TTS "Hania" — swap for hania.mp3 later
    try{
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance('Hania');
      u.rate=1.05; u.pitch=1.1; speechSynthesis.speak(u);
    }catch(e){}
  },
  hurt(){ this.tone(220,0.3,'sawtooth',0.5,0,60); this.noise(0.2,0.4); },
  checkpoint(){ [523,659,784].forEach((f,i)=>this.tone(f,0.15,'square',0.3,i*0.09)); },
  win(){ [523,659,784,1046,1318].forEach((f,i)=>this.tone(f,0.22,'square',0.35,i*0.11)); },
  lose(){ [400,300,220,150].forEach((f,i)=>this.tone(f,0.25,'sawtooth',0.35,i*0.14)); },
  /* --- chiptune loop: cheerful original, per-level key/tempo --- */
  startMusic(levelIdx){
    this.stopMusic(); if(!this.ctx) return;
    const scales=[[0,2,4,7,9],[0,2,3,7,8],[0,1,5,6,10]]; // major-ish, minor-ish, phrygian-ish
    const roots=[262,294,220]; const bpm=[132,140,150][levelIdx]||132;
    const beat=60/bpm/2; let step=0;
    const sc=scales[levelIdx%3], root=roots[levelIdx%3];
    const bassLine=[0,0,7,0, 5,5,7,5];
    this.musicTimer=setInterval(()=>{
      if(this.muted) { step++; return; }
      const s=step%16, bar=Math.floor(step/16)%4;
      // lead: bouncy arpeggio
      if(s%2===0){
        const n=sc[(s/2+bar*2)%sc.length];
        this.tone(root*Math.pow(2,n/12)*2, beat*0.9,'square',0.16,0,null,this.musicGain);
      }
      // bass on quarters
      if(s%4===0){
        const b=bassLine[(s/4+bar)%bassLine.length];
        this.tone(root*Math.pow(2,b/12)/2, beat*1.8,'triangle',0.30,0,null,this.musicGain);
      }
      // hat
      if(s%2===1) this.noise(0.03,0.06,0,6000);
      step++;
    }, beat*1000);
  },
  stopMusic(){ if(this.musicTimer){clearInterval(this.musicTimer); this.musicTimer=null;} }
};

/* ================= INPUT ================= */
const Input = {
  left:false,right:false,jump:false,jumpPressed:false,
  init(canvas){
    const key=(e,down)=>{
      const k=e.key.toLowerCase();
      if(['arrowleft','a'].includes(k)) this.left=down;
      if(['arrowright','d'].includes(k)) this.right=down;
      if([' ','arrowup','w'].includes(k)){ if(down&&!this.jump) this.jumpPressed=true; this.jump=down; }
      if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
    };
    window.addEventListener('keydown',e=>key(e,true));
    window.addEventListener('keyup',e=>key(e,false));
    const bind=(id,prop)=>{
      const el=document.getElementById(id);
      const on=e=>{e.preventDefault(); if(prop==='jump'&&!this.jump) this.jumpPressed=true; this[prop]=true; el.classList.add('on');};
      const off=e=>{e.preventDefault(); this[prop]=false; el.classList.remove('on');};
      el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
      el.addEventListener('pointercancel',off); el.addEventListener('pointerleave',off);
    };
    bind('tLeft','left'); bind('tRight','right'); bind('tJump','jump');
    canvas.addEventListener('pointerdown',()=>AudioSys.init(),{once:true});
  },
  postUpdate(){ this.jumpPressed=false; }
};

/* ================= GAME ================= */
const Game = {
  state:'menu', levelIdx:0, L:null,
  hero:{x:0,y:0,vx:0,vy:0,face:1,grounded:false,coyote:0,jbuf:0,runPh:0,squashT:0,invuln:0,flash:0,groundPlat:null},
  lives:3, levelTime:0, totalTime:0, totalHanias:0, levelHanias:0,
  camX:0, plats:[], fires:[], cols:[], parts:[], floats:[],
  respawn:{x:0,y:0}, checkpointDone:false, goalT:0,

  loadLevel(i){
    this.levelIdx=i; this.L=LEVELS[i];
    const L=this.L;
    this.plats=L.platforms.map(p=>({...p, ox:p.x, oy:p.y, t:Math.random()*10}));
    this.fires=L.fires.map(f=>{
      const o={...f};
      if(o.kind==='small'){ o.y=o.y??460; o.w=36; o.h=48; o.seed=Math.random()*10; }
      if(o.kind==='pillar'){ o.y=460; o.w=46; o.maxH=175; o.seed=o.phase||0; }
      if(o.kind==='pit'){ o.h=56; o.seed=Math.random()*10; }
      if(o.kind==='ball'){ o.r=20; o.y=(o.y??460)-20; o.vx=0; o.vy=0; o.dirT=0; o.dir=1; o.seed=Math.random()*10; }
      return o;
    });
    this.cols=L.collectibles.map(c=>({...c, taken:false, seed:Math.random()*10}));
    this.parts=[]; this.floats=[];
    this.lives=3; this.levelTime=0; this.levelHanias=0;
    this.checkpointDone=false;
    this.respawn={x:L.spawn.x, y:L.spawn.y};
    this.spawnHero();
    this.camX=0;
    document.getElementById('levelLabel').textContent='LV '+(i+1);
  },
  spawnHero(){
    const h=this.hero;
    h.x=this.respawn.x; h.y=this.respawn.y; h.vx=0; h.vy=0;
    h.face=1; h.invuln=2; h.flash=0; h.grounded=false; h.groundPlat=null;
  },
  start(){ AudioSys.init(); this.totalHanias=0; this.totalTime=0; this.loadLevel(0);
    this.state='play'; UI.show(null); AudioSys.startMusic(0); },
  nextLevel(){
    this.totalTime+=this.levelTime;
    if(this.levelIdx+1>=LEVELS.length){ this.state='win'; AudioSys.win(); AudioSys.stopMusic();
      UI.show('winOv'); document.getElementById('winStats').innerHTML=
        `🔥 Hanias: <b>${this.totalHanias}</b> &nbsp;•&nbsp; ⏱ ${fmtTime(this.totalTime)}`;
    } else { this.loadLevel(this.levelIdx+1); this.state='play'; UI.show(null);
      AudioSys.startMusic(this.levelIdx); }
  },
  retry(){ this.totalTime+=this.levelTime; this.loadLevel(this.levelIdx); this.state='play';
    UI.show(null); AudioSys.startMusic(this.levelIdx); },
  toMenu(){ this.state='menu'; AudioSys.stopMusic(); UI.show('menuOv'); },

  hurt(){
    const h=this.hero;
    if(h.invuln>0||this.state!=='play') return;
    this.lives--; AudioSys.hurt(); h.flash=0.6; h.invuln=2;
    this.float(h.x,h.y-30,'OUCH!','#ff5d5d');
    if(this.lives<=0){
      this.state='over'; AudioSys.lose(); AudioSys.stopMusic(); UI.show('overOv');
      document.getElementById('overStats').innerHTML=
        `Reached <b>${this.L.name}</b> &nbsp;•&nbsp; 🔥 ${this.totalHanias+this.levelHanias} Hanias`;
    } else {
      this.spawnHero();
      this.float(h.x,h.y-30,'-1 ❤','#ff5d5d');
    }
  },
  float(x,y,txt,color){ this.floats.push({x,y,txt,color:color||'#fff',t:0,life:1.1}); },
  burst(x,y,color,n,spd){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=spd*(0.4+Math.random());
    this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0,max:0.5+Math.random()*0.4,color,size:3+Math.random()*4,grav:500}); } },

  update(dt){
    const h=this.hero, L=this.L;
    this.levelTime+=dt;
    /* --- moving platforms --- */
    for(const p of this.plats){
      if(p.kind==='move'){
        p.t+=dt;
        const off=Math.sin(p.t*p.speed/60)*(p.range/2);
        const nx=p.axis==='x'?p.ox+off:p.ox, ny=p.axis==='y'?p.oy+off:p.oy;
        p.dx=nx-p.x; p.dy=ny-p.y; p.x=nx; p.y=ny;
      } else { p.dx=0; p.dy=0; }
    }
    /* --- input (ice levels are slippery!) --- */
    const icy=this.L.ice?1:0;
    const ax=(Input.right?1:0)-(Input.left?1:0);
    if(ax!==0){ h.vx+=ax*RUN_ACCEL*(icy?0.7:1)*dt; h.face=ax; h.runPh+=Math.abs(h.vx)*dt*0.06; }
    else { const f=FRICTION*(icy?0.10:1)*dt; h.vx-=Math.sign(h.vx)*Math.min(Math.abs(h.vx),f); }
    h.vx=Math.max(-RUN_MAX,Math.min(RUN_MAX,h.vx));
    if(h.grounded) h.coyote=COYOTE; else h.coyote-=dt;
    if(Input.jumpPressed) h.jbuf=JBUF; else h.jbuf-=dt;
    if(h.jbuf>0&&h.coyote>0){
      h.vy=-JUMP_V; h.grounded=false; h.coyote=0; h.jbuf=0; h.squashT=0.18;
      AudioSys.jump(); this.float(h.x,h.y-40,'Aag','#ffb35c');
      this.burst(h.x,h.y+HERO_H,'#c9c9c9',6,90);
    }
    /* variable jump: low gravity while rising & held */
    const g=(Input.jump&&h.vy<0)?JUMP_HOLD_GRAV:GRAV;
    if(!Input.jump&&h.vy<-260) h.vy=-260; // jump cut
    h.vy+=g*dt; if(h.vy>1100) h.vy=1100;
    /* --- integrate + collide --- */
    const wasGrounded=h.grounded, oldVy=h.vy;
    h.groundPlat=null;
    h.x+=h.vx*dt; this.collideX();
    h.y+=h.vy*dt; h.grounded=false; this.collideY();
    if(!wasGrounded&&h.grounded){ h.squashT=0.16; this.burst(h.x,h.y+HERO_H,'#ffffff',5,70); } // land
    if(h.groundPlat){ h.x+=h.groundPlat.dx; h.y+=h.groundPlat.dy; }
    if(h.invuln>0) h.invuln-=dt;
    if(h.flash>0) h.flash-=dt;
    if(h.squashT>0) h.squashT-=dt;
    /* fell out of world */
    if(h.y>720) { this.hurt(); return; }
    /* --- fires --- */
    for(const f of this.fires) this.updateFire(f,dt);
    /* --- collectibles --- */
    for(const c of this.cols){
      if(c.taken) continue;
      if(Math.abs(h.x-c.x)<44&&Math.abs(h.y+35-c.y)<55){
        c.taken=true; this.levelHanias++;
        AudioSys.collect(); AudioSys.sayHania();
        this.float(c.x,c.y-24,'Hania','#ffd94a');
        this.burst(c.x,c.y,'#ffd94a',14,150);
        this.burst(c.x,c.y,'#fff',8,110);
      }
    }
    /* --- checkpoint & goal --- */
    if(!this.checkpointDone&&h.x>L.checkpoint.x){
      this.checkpointDone=true; this.respawn={x:L.checkpoint.x,y:390};
      AudioSys.checkpoint(); this.float(h.x,h.y-50,'🚩 Checkpoint!','#7ddfff');
    }
    if(Math.abs(h.x-L.goal.x)<40&&h.y>300){ this.levelDone(); return; }
    /* --- camera --- */
    const tx=Math.max(0,Math.min(L.width-VW, h.x-VW*0.42));
    this.camX+=(tx-this.camX)*Math.min(1,7*dt);
    /* --- particles --- */
    this.updateParts(dt);
    /* --- HUD --- */
    UI.hud(this.totalHanias+this.levelHanias, this.lives, this.levelTime);
    Input.postUpdate();
  },

  collideX(){
    const h=this.hero;
    for(const p of this.plats){
      if(h.x+HERO_W/2>p.x&&h.x-HERO_W/2<p.x+p.w&&h.y+HERO_H>p.y&&h.y<p.y+p.h){
        if(h.vx>0) h.x=p.x-HERO_W/2; else if(h.vx<0) h.x=p.x+p.w+HERO_W/2;
        h.vx=0;
      }
    }
    h.x=Math.max(HERO_W/2,Math.min(this.L.width-HERO_W/2,h.x));
  },
  collideY(){
    const h=this.hero;
    for(const p of this.plats){
      if(h.x+HERO_W/2>p.x&&h.x-HERO_W/2<p.x+p.w&&h.y+HERO_H>p.y&&h.y<p.y+p.h){
        if(h.vy>0){ h.y=p.y-HERO_H; h.vy=0; h.grounded=true; h.groundPlat=p; }
        else if(h.vy<0){ h.y=p.y+p.h; h.vy=0; }
      }
    }
  },
  groundAt(x,y){ // any platform containing point?
    for(const p of this.plats) if(x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h) return p;
    return null;
  },
  heroHits(x0,y0,x1,y1){
    const h=this.hero;
    return h.x+HERO_W/2>x0&&h.x-HERO_W/2<x1&&h.y+HERO_H>y0&&h.y<y1;
  },

  updateFire(f,dt){
    const h=this.hero;
    f.seed+=dt;
    if(f.kind==='small'||f.kind==='pit'){
      const w=f.w, hh=f.h, x0=f.x-w/2, y0=f.y-hh;
      // ember particles
      if(Math.random()<dt*14) this.parts.push({x:f.x+(Math.random()-0.5)*w*0.8,y:f.y-hh*0.4,
        vx:(Math.random()-0.5)*30,vy:-60-Math.random()*60,life:0,max:0.7,color:'#ffb35c',size:2+Math.random()*3,grav:-40});
      if(this.heroHits(x0+6,y0+8,x0+w-6,f.y)) this.hurt();
      f.hx=x0; f.hy=y0;
    } else if(f.kind==='pillar'){
      const T=f.period, t=(f.seed%T);
      let k; // 0..1 height factor: rise, hold, fall
      if(t<T*0.4) k=t/(T*0.4); else if(t<T*0.6) k=1; else k=1-(t-T*0.6)/(T*0.4);
      f.curH=k*f.maxH;
      const x0=f.x-f.w/2, y0=f.y-f.curH;
      if(f.curH>20&&this.heroHits(x0+8,y0,x0+f.w-8,f.y)) this.hurt();
      if(Math.random()<dt*20*k) this.parts.push({x:f.x+(Math.random()-0.5)*f.w,y:f.y-f.curH*Math.random(),
        vx:(Math.random()-0.5)*40,vy:-80-Math.random()*60,life:0,max:0.6,color:'#ff7a2e',size:3,grav:-30});
    } else if(f.kind==='ball'){
      // roll toward hero, turn at edges
      f.dirT-=dt;
      if(f.dirT<=0){ f.dirT=1; f.dir=Math.sign(h.x-f.x)||1; }
      const ahead=f.x+f.dir*(f.r+14);
      if(!this.groundAt(ahead,f.y+f.r+8)) f.dir*=-1;
      f.vx=f.dir*58;
      f.vy+=GRAV*dt;
      f.x+=f.vx*dt;
      const p=this.groundAt(f.x,f.y+f.r+4);
      if(p&&f.vy>0){ f.y=p.y-f.r; f.vy=0; }
      if(Math.random()<dt*10) this.parts.push({x:f.x+(Math.random()-0.5)*f.r,y:f.y,
        vx:(Math.random()-0.5)*30,vy:-50-Math.random()*40,life:0,max:0.5,color:'#ffb35c',size:2.5,grav:-20});
      if(Math.abs(h.x-f.x)<f.r+20&&Math.abs(h.y+35-f.y)<f.r+30) this.hurt();
    }
  },
  updateParts(dt){
    for(let i=this.parts.length-1;i>=0;i--){ const p=this.parts[i];
      p.life+=dt; if(p.life>=p.max){this.parts.splice(i,1);continue;}
      p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
    for(let i=this.floats.length-1;i>=0;i--){ const f=this.floats[i];
      f.t+=dt; if(f.t>=f.life){this.floats.splice(i,1);continue;} f.y-=34*dt;
    }
  },
  levelDone(){
    this.state='leveldone'; this.totalHanias+=this.levelHanias;
    AudioSys.win();
    this.burst(this.hero.x,this.hero.y,'#ffd94a',30,220);
    UI.show('levelOv');
    document.getElementById('levelTitle').textContent=this.L.name+' Complete!';
    document.getElementById('levelStats').innerHTML=
      `🔥 Hanias: <b>${this.levelHanias}</b> &nbsp;•&nbsp; ⏱ ${fmtTime(this.levelTime)}`;
    Input.postUpdate();
  },
};
function fmtTime(s){ const m=Math.floor(s/60), ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); }

/* ================= RENDER ================= */
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
function srand(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

const Render={
  draw(){
    const G=Game, L=G.L;
    ctx.clearRect(0,0,VW,VH);
    if(!L||!Sprites.ready){ if(Game.state!=='menu') this.drawLoading(); return; }
    const cx=Math.round(G.camX);
    /* sky */
    const sky=ctx.createLinearGradient(0,0,0,VH);
    sky.addColorStop(0,L.theme.sky[0]); sky.addColorStop(1,L.theme.sky[1]);
    ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);
    ctx.save(); ctx.translate(-cx,0);
    this.decor(L,cx);
    for(const p of G.plats) this.platform(p,L);
    this.flag(L.checkpoint.x, G.checkpointDone?'#39d353':'#8a8f9d', '🚩');
    this.goalFlag(L.goal.x);
    for(const c of G.cols) if(!c.taken) this.collectible(c);
    for(const f of G.fires) this.fire(f);
    if(G.state!=='menu') this.hero(G.hero);
    this.particles(G); this.floats(G);
    ctx.restore();
    if(G.state==='menu') this.titleBackdrop();
  },
  drawLoading(){ ctx.fillStyle='#0b0e1a'; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#ffd94a'; ctx.font='bold 28px monospace'; ctx.textAlign='center';
    ctx.fillText('Loading...',VW/2,VH/2); },
  titleBackdrop(){ /* dim behind menu overlay */ },

  decor(L,cx){
    const R=srand(Game.levelIdx*991+7);
    const now=performance.now()/1000;
    if(Game.levelIdx===0){ // BEACH: sun, clouds, sea, palm trees
      ctx.fillStyle='#fff6d8'; ctx.beginPath(); ctx.arc(cx+VW-110,90,44,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,246,216,.35)'; ctx.beginPath(); ctx.arc(cx+VW-110,90,66,0,7); ctx.fill();
      // distant sea with animated waves
      ctx.fillStyle='#2e9fe8'; ctx.fillRect(cx-120,300,VW+240,64);
      ctx.fillStyle='#7fd0ff'; ctx.fillRect(cx-120,300,VW+240,10);
      ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=3;
      for(let i=0;i<7;i++){ const wx=cx-100+((i*190+now*46)%(VW+200));
        ctx.beginPath(); ctx.arc(wx,332,24,Math.PI,0); ctx.stroke(); }
      // clouds
      ctx.fillStyle='rgba(255,255,255,.92)';
      for(let i=0;i<8;i++){ const x=R()*L.width, y=40+R()*120, s=0.7+R()*0.9;
        const px=x-cx*0.25; if(px<-120||px>VW+120) continue;
        ctx.beginPath();
        ctx.ellipse(px,y,46*s,18*s,0,0,7); ctx.ellipse(px-30*s,y+6*s,28*s,13*s,0,0,7); ctx.ellipse(px+30*s,y+6*s,28*s,13*s,0,0,7);
        ctx.fill();
      }
      // palm trees
      for(let i=0;i<12;i++){ const x=R()*L.width; if(x<cx-60||x>cx+VW+60) continue;
        const p=Game.groundAt(x,470); if(!p||p.kind!=='ground') continue;
        const h=90+R()*50, lean=(R()-0.5)*24;
        ctx.fillStyle='#8a5a2e'; ctx.fillRect(x-7,p.y-h,14,h);
        const txp=x+lean;
        ctx.fillStyle='#3e9e4f';
        for(let f=0;f<5;f++){ const a=-Math.PI/2+(f-2)*0.5;
          ctx.beginPath(); ctx.ellipse(txp+Math.cos(a)*32,p.y-h+Math.sin(a)*13,30,9,a,0,7); ctx.fill(); }
        ctx.fillStyle='#6b3a1e';
        ctx.beginPath(); ctx.arc(txp-9,p.y-h+4,8,0,7); ctx.arc(txp+9,p.y-h+4,8,0,7); ctx.fill();
      }
    } else if(Game.levelIdx===1){ // SNOW: mountains, pines, falling snow
      ctx.fillStyle='rgba(150,172,205,.6)';
      for(let i=0;i<8;i++){ const x=R()*L.width, bx=x-cx*0.35;
        if(bx<-160||bx>VW+160) continue;
        const mh=180+R()*120;
        ctx.beginPath(); ctx.moveTo(bx-130,470); ctx.lineTo(bx,470-mh); ctx.lineTo(bx+130,470); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.9)';
        ctx.beginPath(); ctx.moveTo(bx-32,470-mh+64); ctx.lineTo(bx,470-mh); ctx.lineTo(bx+32,470-mh+64);
        ctx.lineTo(bx+15,470-mh+52); ctx.lineTo(bx,470-mh+64); ctx.lineTo(bx-15,470-mh+52); ctx.fill();
        ctx.fillStyle='rgba(150,172,205,.6)'; }
      for(let i=0;i<16;i++){ const x=R()*L.width; if(x<cx-50||x>cx+VW+50) continue;
        const p=Game.groundAt(x,470); if(!p||p.kind!=='ground') continue;
        const h=60+R()*50;
        ctx.fillStyle='#5a3a22'; ctx.fillRect(x-5,p.y-18,10,18);
        ctx.fillStyle='#2e6b3e';
        for(let ti=0;ti<3;ti++){ const tw=46-ti*11, ty=p.y-18-ti*22;
          ctx.beginPath(); ctx.moveTo(x-tw/2,ty); ctx.lineTo(x,ty-26); ctx.lineTo(x+tw/2,ty); ctx.fill(); }
        ctx.fillStyle='rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.moveTo(x-10,p.y-84); ctx.lineTo(x,p.y-106); ctx.lineTo(x+10,p.y-84); ctx.fill();
      }
      // falling snowflakes
      ctx.fillStyle='rgba(255,255,255,.92)';
      for(let i=0;i<70;i++){
        const fx0=R()*VW, spd=40+R()*70, ph=R()*7, fy0=R()*(VH+40);
        const fy=((fy0+now*spd)%(VH+40))-20;
        ctx.fillRect(cx+fx0+Math.sin(now*1.6+ph)*20, fy, 3.5, 3.5);
      }
    } else { // CASTLE: moon, towers, banners, torch glow
      ctx.fillStyle='#f4ead0'; ctx.beginPath(); ctx.arc(cx+VW-120,84,36,0,7); ctx.fill();
      ctx.fillStyle='rgba(244,234,208,.22)'; ctx.beginPath(); ctx.arc(cx+VW-120,84,56,0,7); ctx.fill();
      ctx.fillStyle='#1c1430';
      for(let i=0;i<7;i++){ const x=R()*L.width, bx=x-cx*0.45;
        if(bx<-120||bx>VW+120) continue;
        const th=220+R()*140;
        ctx.fillRect(bx,470-th,90,th);
        for(let b=0;b<5;b++) ctx.fillRect(bx+b*20,470-th-16,12,16);
        ctx.fillStyle='#ffb35c'; ctx.fillRect(bx+35,470-th+70,20,44);
        ctx.fillStyle='#1c1430'; }
      for(let i=0;i<10;i++){ const x=R()*L.width; if(x<cx-40||x>cx+VW+40) continue;
        const p=Game.groundAt(x,470); if(!p||p.kind!=='ground') continue;
        ctx.fillStyle='#3a3a44'; ctx.fillRect(x-3,p.y-150,6,150);
        ctx.fillStyle=i%2?'#a83232':'#2e4a8f';
        ctx.beginPath(); ctx.moveTo(x+3,p.y-150); ctx.lineTo(x+57,p.y-150); ctx.lineTo(x+57,p.y-112);
        ctx.lineTo(x+30,p.y-124); ctx.lineTo(x+3,p.y-112); ctx.fill();
        ctx.fillStyle='#ffd94a'; ctx.fillRect(x+3,p.y-150,54,6);
      }
      for(let i=0;i<12;i++){ const x=R()*L.width; if(x<cx-70||x>cx+VW+70) continue;
        const p=Game.groundAt(x,470); if(!p||p.kind!=='ground') continue;
        const flick=0.4+0.15*Math.sin(now*11+i*2.3);
        const gr=ctx.createRadialGradient(x,p.y-52,4,x,p.y-52,64);
        gr.addColorStop(0,'rgba(255,150,40,'+flick+')'); gr.addColorStop(1,'rgba(255,150,40,0)');
        ctx.fillStyle=gr; ctx.fillRect(x-64,p.y-116,128,128);
        ctx.fillStyle='#5a3a1e'; ctx.fillRect(x-3,p.y-52,6,52);
        ctx.fillStyle='#ff9a2e';
        ctx.beginPath(); ctx.ellipse(x,p.y-56,7,11+3*Math.sin(now*13+i),0,0,7); ctx.fill();
      }
    }
  },

  platform(p,L){
    const t=L.theme;
    if(p.kind==='ground'){
      ctx.fillStyle=t.ground; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle=t.groundDark; ctx.fillRect(p.x,p.y+p.h-26,p.w,26);
      ctx.fillStyle=t.accent; ctx.fillRect(p.x,p.y,p.w,10); // top highlight
      // speckles
      ctx.fillStyle='rgba(0,0,0,.12)';
      const R=srand(Math.floor(p.x));
      for(let i=0;i<p.w/46;i++){ ctx.fillRect(p.x+8+R()*(p.w-16), p.y+22+R()*40, 6, 5); }
      if(Game.levelIdx===2){ // lava-moat cracks in the castle stone
        ctx.fillStyle='#ff5a2e';
        for(let i=0;i<p.w/130;i++){ const lx=p.x+20+i*130; ctx.fillRect(lx,p.y+2,26,5); }
      }
      if(Game.levelIdx===1){ // icy sheen on snow
        ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fillRect(p.x,p.y,p.w,5);
        ctx.fillStyle='rgba(160,200,255,.35)'; ctx.fillRect(p.x,p.y+5,p.w,4);
      }
    } else if(p.kind==='brick'){
      ctx.fillStyle=t.plat; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.strokeStyle=t.platDark; ctx.lineWidth=3; ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2);
      ctx.beginPath(); ctx.moveTo(p.x+p.w/2,p.y); ctx.lineTo(p.x+p.w/2,p.y+p.h); ctx.stroke();
    } else if(p.kind==='pipe'){
      ctx.fillStyle='#3e9e4f'; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='#2c7a3a'; ctx.fillRect(p.x,p.y,p.w,10);
      ctx.fillStyle='#57c06a'; ctx.fillRect(p.x+6,p.y+10,10,p.h-10);
      ctx.strokeStyle='#1d5c28'; ctx.lineWidth=3; ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2);
    } else if(p.kind==='move'){
      ctx.fillStyle='#7d5cff'; ctx.fillRect(p.x,p.y,p.w,p.h);
      ctx.fillStyle='#a68cff'; ctx.fillRect(p.x,p.y,p.w,7);
      ctx.strokeStyle='#4a34a8'; ctx.lineWidth=3; ctx.strokeRect(p.x+1,p.y+1,p.w-2,p.h-2);
      ctx.fillStyle='#fff'; ctx.font='bold 13px monospace'; ctx.textAlign='center';
      ctx.fillText(p.axis==='x'?'◀ ▶':'▲ ▼', p.x+p.w/2, p.y+p.h/2+5);
    }
  },

  flame(x,yBase,w,h,seed){
    if(h<=4) return;
    const fl=Math.sin(seed*17)+Math.sin(seed*29+1.7)*0.5;
    const hh=h*(1+fl*0.12);
    // glow
    const gr=ctx.createRadialGradient(x,yBase-hh/2,4,x,yBase-hh/2,w*1.4);
    gr.addColorStop(0,'rgba(255,140,30,.45)'); gr.addColorStop(1,'rgba(255,140,30,0)');
    ctx.fillStyle=gr; ctx.fillRect(x-w*1.6,yBase-hh-w*1.6,w*3.2,hh+w*3.2);
    const layer=(ww,hh2,col,dy)=>{
      ctx.fillStyle=col; ctx.beginPath();
      ctx.ellipse(x+Math.sin(seed*23)*3, yBase-hh2/2-dy, ww/2, hh2/2, 0, 0, 7);
      ctx.fill();
    };
    layer(w,hh,'#e8301e',0);
    layer(w*0.68,hh*0.68,'#ff7a2e',2);
    layer(w*0.4,hh*0.42,'#ffd94a',4);
  },
  fire(f){
    if(f.kind==='small'||f.kind==='pit'){
      this.flame(f.x, f.y, f.w, f.h*(0.92+0.08*Math.sin(f.seed*21)), f.seed);
      // charred base
      ctx.fillStyle='rgba(20,10,10,.85)';
      ctx.fillRect(f.x-f.w/2-6, f.y-8, f.w+12, 10);
    } else if(f.kind==='pillar'){
      if(f.curH>4){
        ctx.fillStyle='#3a3a3a'; ctx.fillRect(f.x-f.w/2-8, f.y-14, f.w+16, 16); // vent
        this.flame(f.x, f.y-10, f.w, f.curH, f.seed);
      } else {
        ctx.fillStyle='#3a3a3a'; ctx.fillRect(f.x-f.w/2-8, f.y-14, f.w+16, 16);
        ctx.fillStyle='rgba(255,90,30,.5)'; ctx.fillRect(f.x-f.w/2-8, f.y-18, f.w+16, 4);
      }
    } else if(f.kind==='ball'){
      const g=ctx.createRadialGradient(f.x-5,f.y-6,2,f.x,f.y,f.r+10);
      g.addColorStop(0,'#ffd94a'); g.addColorStop(0.55,'#ff7a2e'); g.addColorStop(1,'rgba(232,48,30,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f.x,f.y,f.r+8+Math.sin(f.seed*25)*3,0,7); ctx.fill();
      ctx.fillStyle='#e8301e'; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
      ctx.fillStyle='#ffd94a'; ctx.beginPath(); ctx.arc(f.x-4,f.y-5,f.r*0.45,0,7); ctx.fill();
    }
  },

  collectible(c){
    const bob=Math.sin(c.seed*2+performance.now()/450)*6;
    const w=34, h=68, x=c.x-w/2, y=c.y-h/2+bob;
    if(Sprites.ready) ctx.drawImage(Sprites.collect,x,y,w,h);
    // sparkle ring
    ctx.strokeStyle=`rgba(255,217,74,${0.5+0.4*Math.sin(performance.now()/300)})`;
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(c.x,c.y+bob,26+3*Math.sin(performance.now()/350),0,7); ctx.stroke();
  },

  flag(x,color,emoji){
    ctx.fillStyle='#8a6f2e'; ctx.fillRect(x-3,346,6,114);
    ctx.fillStyle=color; ctx.beginPath();
    ctx.moveTo(x+3,346); ctx.lineTo(x+43,358); ctx.lineTo(x+3,370); ctx.fill();
    ctx.font='20px monospace'; ctx.fillText(emoji,x-32,352);
  },
  goalFlag(x){
    ctx.fillStyle='#d8b93e'; ctx.fillRect(x-4,320,8,140);
    ctx.fillStyle='#ffd94a';
    for(let i=0;i<3;i++) for(let j=0;j<2;j++){ if((i+j)%2===0) ctx.fillRect(x+4+i*16,320+j*16,16,16); }
    ctx.strokeStyle='#8a6f2e'; ctx.lineWidth=2; ctx.strokeRect(x+4,320,48,32);
    ctx.fillStyle='#fff'; ctx.font='bold 15px monospace'; ctx.textAlign='center';
    ctx.fillText('GOAL',x+28,372);
  },

  hero(h){
    if(h.invuln>0 && Math.floor(performance.now()/90)%2===0 && h.flash<=0) return; // blink
    const dw=50, dh=75;
    let sx=1, sy=1;
    if(h.grounded&&Math.abs(h.vx)>40){ const s=Math.sin(h.runPh); sx=1+0.09*s; sy=1-0.09*s; }
    if(!h.grounded){ sx=0.92; sy=1.12; }
    if(h.squashT>0){ const k=h.squashT/0.18; sx=1+0.22*k; sy=1-0.2*k; }
    ctx.save();
    ctx.translate(h.x,h.y+HERO_H/2); ctx.scale(h.face*sx,sy);
    if(Sprites.ready) ctx.drawImage(Sprites.hero,-dw/2,-dh/2-(HERO_H-dh)/2-4,dw,dh);
    ctx.restore();
    if(h.flash>0){ ctx.fillStyle=`rgba(255,40,40,${h.flash})`;
      ctx.fillRect(h.x-dw/2,h.y-6,dw,dh); }
  },

  particles(G){
    for(const p of G.parts){
      const k=1-p.life/p.max;
      ctx.globalAlpha=k; ctx.fillStyle=p.color;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;
  },
  floats(G){
    ctx.textAlign='center'; ctx.font='bold 21px "Courier New",monospace';
    for(const f of G.floats){
      const k=1-f.t/f.life;
      ctx.globalAlpha=Math.min(1,k*2);
      ctx.lineWidth=4; ctx.strokeStyle='#000'; ctx.strokeText(f.txt,f.x,f.y);
      ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x,f.y);
    }
    ctx.globalAlpha=1;
  },
};

let last=0, acc=0; const STEP=1/60;
function frame(t){
  requestAnimationFrame(frame);
  let dt=(t-last)/1000; last=t; if(!(dt>0)||dt>0.25) dt=0.016;
  if(Game.state==='play'){ acc+=dt; let n=0; while(acc>=STEP&&n<5){ Game.update(STEP); acc-=STEP; n++; } }
  else Input.postUpdate();
  Render.draw();
}
requestAnimationFrame(frame);
